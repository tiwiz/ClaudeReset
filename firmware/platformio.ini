; Claude Usage Ring — D1 mini (ESP8266) + GC9A01 240x240
; TFT_eSPI configurato da build_flags (USER_SETUP_LOADED), così i pin stanno
; qui e si leggono insieme al resto della mappa in docs/wiring.md.
;
;   pio run                      compila
;   pio run -t upload            compila e flasha (scheda collegata via USB)
;   pio device monitor           log seriale

[env:d1_mini]
platform  = espressif8266
board     = d1_mini
framework = arduino

monitor_speed = 115200
upload_speed  = 460800
board_build.f_cpu = 160000000L
board_build.flash_size = 4MB

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  -DUSER_SETUP_LOADED=1
  ; --- pannello ---
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  ; --- pin (vedi docs/wiring.md) ---
  -DTFT_MISO=-1
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  ; CS del modulo va a GND (bus con un solo dispositivo): niente GPIO15,
  ; che e' un pin di strapping e col display collegato blocca il boot.
  -DTFT_CS=-1
  -DTFT_DC=4
  -DTFT_RST=5
  -DTFT_BL=-1
  ; --- font e velocità ---
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=0
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=6000000
