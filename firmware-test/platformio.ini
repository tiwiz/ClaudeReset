; Pattern di prova per il display rotondo 240x240 — diagnostica a occhio.
; Non serve WiFi e non usa config.h: serve solo a capire se il pannello
; si accende, con QUALI driver e con QUALI pin.
;
;   pio run -e gc9a01 -t upload      (driver GC9A01: il caso atteso)
;   pio run -e st7789 -t upload      (se il pannello fosse un ST7789)
;   pio run -e ili9341 -t upload     (per escludere un pannello "normale")
;   pio device monitor               (log a 115200)
;
; Se lo schermo resta nero con tutti i driver, il problema e' a monte:
; alimentazione, fili o modulo difettoso — non il software.

[platformio]
default_envs = gc9a01

[env]
platform     = espressif8266
board        = d1_mini
framework    = arduino
monitor_speed = 115200
upload_speed  = 460800
board_build.f_cpu = 160000000L
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=-1
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=12
  -DTFT_DC=4
  -DTFT_RST=5
  -DTFT_BL=-1
  -DLOAD_GLCD=1
  -DLOAD_GFXFF=1
  -DLOAD_FONT2=1
  -DSPI_FREQUENCY=27000000

[env:gc9a01]
build_flags = ${env.build_flags} -DGC9A01_DRIVER=1

[env:st7789]
build_flags = ${env.build_flags} -DST7789_DRIVER=1

[env:ili9341]
build_flags = ${env.build_flags} -DILI9341_DRIVER=1
